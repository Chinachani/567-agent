name: desktop-packaged

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows native install and data migration
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies
      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $compilers = @(
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          )
          if (-not ($compilers | Where-Object { Test-Path $_ })) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Unable to install Inno Setup 6.' }
          }
      - name: Run production installer script with a small payload
        working-directory: apps/desktop
        env:
          AGENT567_VERIFY_WINDOWS_INSTALL: "1"
        run: bun run verify:install:windows:fixture
      - name: Upload native installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-installer-diagnostics
          path: apps/desktop/release/installer-verification
          if-no-files-found: ignore
          retention-days: 7

  contract:
    name: Desktop packaging contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Verify packaging contract
        run: node apps/desktop/scripts/verify-packaging-contract.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Test packaging contract helpers
        run: node --test apps/desktop/scripts/desktop-packaging-layout.test.mjs apps/desktop/scripts/electron-e2e-service-options.node-test.mjs apps/desktop/scripts/packaged-e2e-binary.node-test.mjs apps/desktop/scripts/packaged-native-dependencies.test.mjs

  scope:
    name: Detect packaged smoke scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packaged-smoke: ${{ steps.detect.outputs.packaged-smoke }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect packaging-sensitive changes
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/quality/desktop-packaging-scope.mjs

  remote-native:
    name: Linux capture and input regression
    needs: scope
    if: needs.scope.outputs.packaged-smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/install-bun-dependencies
      - name: Install isolated display and DBus runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb dbus weston libasound2t64 libgbm1 libgtk-3-0t64 libnss3
      - name: Verify bundled input and native capture cancellation
        working-directory: apps/desktop
        shell: bash
        run: AGENT567_TEST_ELECTRON="$(node -e 'process.stdout.write(require("electron"))')" bun run test:remote-native
      - name: Verify narrow sidebar account layout
        working-directory: apps/desktop
        run: bun run test:sidebar-layout
      - name: Verify workspace pages in light, dark and narrow layouts
        working-directory: apps/desktop
        run: bun run test:workspace-layout

  smoke:
    name: ${{ matrix.platform }} packaged E2E
    needs: scope
    if: needs.scope.outputs.packaged-smoke == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            build-command: pack:win:test
          - platform: macOS
            runner: macos-latest
            build-command: dist:mac:test
          - platform: Linux
            runner: ubuntu-latest
            build-command: dist:linux:test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Go for IM gateway
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/im-gateway/go.mod
          cache-dependency-path: apps/im-gateway/go.sum

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libcap-dev meson ninja-build pkg-config xz-utils

      - name: Install Linux Electron runtime dependencies
        if: runner.os == 'Linux'
        # Ubuntu 24.04's libasound2t64 provides the libasound.so.2 linked by Electron.
        run: sudo apt-get install --no-install-recommends -y libasound2t64

      - name: Build unpacked Desktop package
        working-directory: apps/desktop
        env:
          AGENT567_BUILD_ENV: test
          AGENT567_CLOUD_ENABLED: "false"
          AGENT567_OPEN_MARKETPLACE_REPOSITORY: Chinachani/567-agent-marketplace
          AGENT567_SPEECH_INPUT_ENABLED: "false"
          AGENT567_UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          AGENT567_UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}
          AGENT567_UPDATE_PROVIDER: github
        run: bun run ${{ matrix.build-command }}

      - name: Run packaged Electron smoke and updater E2E
        working-directory: apps/desktop
        env:
          AGENT567_E2E_PACKAGED: "1"
          AGENT567_BUILD_ENV: test
          AGENT567_SPEECH_INPUT_ENABLED: "false"
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "Linux" ]]; then
            xvfb-run --auto-servernum bun run test:e2e:packaged
          else
            bun run test:e2e:packaged
          fi

      - name: Upload packaged diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-packaged-e2e-diagnostics
          if-no-files-found: ignore
          retention-days: 1
          path: |
            apps/desktop/release/**
            apps/desktop/.wdio-electron-user-data/**
