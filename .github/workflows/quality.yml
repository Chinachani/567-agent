name: quality

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

env:
  AGENT567_TEST_REPORTS: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: check + quality tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check candidate version metadata
        run: node scripts/release/candidate-metadata.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Run quality checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run check

      - name: Test quality scripts
        run: bun run test:quality

      - name: Verify runtime contract
        run: bun run verify:runtime-contract

      - name: Verify installed runtime artifact
        run: bun run verify:artifact:installed

      - name: Upload quality test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-test-reports
          path: |
            **/.test-reports/*.xml
            .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: affected unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install --yes ripgrep; }

      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: command -v rg >/dev/null || brew install ripgrep

      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rg = (Get-Command rg.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $rg) {
            $version = '15.2.0'
            $archiveName = "ripgrep-${version}-x86_64-pc-windows-msvc"
            $archive = Join-Path $env:RUNNER_TEMP "$archiveName.zip"
            $digest = '71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5'
            Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$version/$archiveName.zip" `
              -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 2
            if ((Get-FileHash -Path $archive -Algorithm SHA256).Hash -ne $digest) {
              throw 'ripgrep archive SHA-256 does not match the pinned release.'
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
            $rg = Join-Path $env:RUNNER_TEMP "$archiveName/rg.exe"
            if (-not (Test-Path -LiteralPath $rg -PathType Leaf)) { throw 'ripgrep executable is missing.' }
            Split-Path -Parent $rg | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          & $rg --version
          if ($LASTEXITCODE -ne 0) { throw 'ripgrep failed to start.' }

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Test affected workspaces
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        env:
          TEST_CHANGED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run test:changed --base "$TEST_CHANGED_BASE"
        shell: bash

      - name: Test complete candidate workspaces
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: bun run test:unit

      - name: Upload unit test reports and Turbo summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-run-summaries-${{ matrix.os }}
          path: |
            **/.test-reports/*.xml
            .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  android-preflight:
    name: Android candidate checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/mobile.yml
