name: quality

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: check + quality tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Run quality checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run check

      - name: Test quality scripts
        run: bun run test:quality

      - name: Verify runtime contract
        run: bun run verify:runtime-contract

      - name: Verify installed runtime artifact
        run: bun run verify:artifact:installed

  unit-tests:
    name: affected unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install --yes ripgrep; }

      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: command -v rg >/dev/null || brew install ripgrep

      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install ripgrep --yes --no-progress }

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Test affected workspaces
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
        env:
          TEST_CHANGED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run test:changed --base "$TEST_CHANGED_BASE"
        shell: bash

      - name: Test complete candidate workspaces
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: bun run test:unit

      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-run-summaries-${{ matrix.os }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 1

  android-preflight:
    name: Android candidate checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/mobile.yml
