name: cloud-release-followup

on:
  push:
    branches: [main]
    paths: [".github/cloud-release-request.json"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the request without creating a tag or starting a release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloud-release-followup
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the cloud request and start the existing release pipeline
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RELEASE_CHECK_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('node:fs');
            const request = JSON.parse(fs.readFileSync('.github/cloud-release-request.json', 'utf8'));
            const dryRun = process.env.DRY_RUN === 'true';
            if (request.enabled !== true && !dryRun) {
              core.info('Cloud release request is disabled.');
              return;
            }
            const { version, sha } = request;
            const match = typeof version === 'string' && /^1\.3\.(0|[1-9]\d{0,5})$/.exec(version);
            if (!match || (!dryRun && Number(match[1]) < 1) || !/^[a-f0-9]{40}$/.test(sha ?? '')) {
              throw new Error('Only a new 1.3.x patch and a complete commit SHA are accepted.');
            }
            const repo = context.repo;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              ...repo, basehead: `${sha}...main`,
            });
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              throw new Error('The requested commit must already be part of main.');
            }
            const readText = async (path, ref = sha) => {
              const { data } = await github.rest.repos.getContent({ ...repo, path, ref });
              if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64') {
                throw new Error(`Expected a UTF-8 repository file: ${path}`);
              }
              return Buffer.from(data.content, 'base64').toString('utf8');
            };
            const desktop = JSON.parse(await readText('apps/desktop/package.json'));
            const currentDesktop = JSON.parse(await readText('apps/desktop/package.json', 'main'));
            const mobile = await readText('apps/mobile/version.properties');
            const name = /^versionName=(.+)$/m.exec(mobile)?.[1]?.trim();
            const code = Number(/^versionCode=(\d+)$/m.exec(mobile)?.[1]);
            if (desktop.version !== version || currentDesktop.version !== version ||
                name !== version || code !== 10300 + Number(match[1])) {
              throw new Error('Desktop, Android version and Android versionCode must agree.');
            }
            if (!(await readText(`.github/release-notes/v${version}.md`)).trim()) {
              throw new Error('Release notes must not be empty.');
            }
            if (dryRun) {
              core.info(`Validated ${version} at ${sha}; no tag or release was created.`);
              return;
            }
            const tag = `v${version}`;
            const optional = async (operation) => {
              try { return await operation(); }
              catch (error) { if (error.status === 404) return undefined; throw error; }
            };
            const released = await optional(() => github.rest.repos.getReleaseByTag({ ...repo, tag }));
            if (released) throw new Error('An existing release must not be changed. Use a new patch version.');
            const ref = await optional(() => github.rest.git.getRef({ ...repo, ref: `tags/${tag}` }));
            if (ref && (ref.data.object.type !== 'commit' || ref.data.object.sha !== sha)) {
              throw new Error('An existing tag must not be moved. Use a new patch version.');
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'desktop-release.yml', head_sha: sha, per_page: 100,
            });
            if (runs.data.workflow_runs.some(run =>
              run.head_branch === tag && (run.status !== 'completed' || run.conclusion === 'success'))) {
              core.info('A release run for this tag is already running or succeeded.');
              return;
            }
            const { pathToFileURL } = require('node:url');
            const { requireReleasePreflight } = await import(pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/release/require-release-preflight.mjs`
            ).href);
            await requireReleasePreflight({
              repository: `${repo.owner}/${repo.repo}`, sha,
              token: process.env.RELEASE_CHECK_TOKEN, maxWaitMs: 110 * 60 * 1000,
            });
            if (!ref) await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha });
            // GITHUB_TOKEN-created tags do not trigger push workflows. Explicit dispatch
            // preserves the normal validation/build/publish jobs without needing a PAT.
            await github.rest.actions.createWorkflowDispatch({
              ...repo, workflow_id: 'desktop-release.yml', ref: tag,
              inputs: { channel: 'stable', release_target: 'github', notes: `Cloud follow-up ${tag}` },
            });
            core.info(`Started the full release pipeline for ${tag} at ${sha}.`);
