name: Build & Release All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :androidApp:assembleDebug
          cd androidApp/build/outputs/apk/debug
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="debug"; fi
          cp androidApp-debug.apk "567 Agent-${VERSION}.apk"
          rm -f androidApp-debug.apk

      - name: Publish Android APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/androidApp/build/outputs/apk/debug/*.apk
          body_path: ${{ github.workspace }}/.github/release-notes/${{ github.ref_name }}.md
          draft: false
          prerelease: false

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            command: package:linux
            artifact_path: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
          - platform: win
            runner: windows-latest
            command: package:win:zip
            artifact_path: "apps/desktop/release/*.zip"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go for IM gateway
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libcap-dev meson ninja-build pkg-config xz-utils rpm

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Build Monorepo Packages
        run: bun run build

      - name: Package Desktop App
        env:
          VETTA_SPEECH_INPUT_ENABLED: "false"
          VETTA_BUILD_ENV: "opensource"
          VETTA_CLOUD_ENABLED: "false"
          VETTA_UPDATE_PROVIDER: "github"
          VETTA_UPDATE_GITHUB_OWNER: "Chinachani"
          VETTA_UPDATE_GITHUB_REPO: "567-agent"
        run: |
          cd apps/desktop
          bun run ${{ matrix.command }}

      - name: Publish Desktop Artifact to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
          body_path: ${{ github.workspace }}/.github/release-notes/${{ github.ref_name }}.md
          draft: false
          prerelease: false
