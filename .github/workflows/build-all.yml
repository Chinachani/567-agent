name: Build All Platforms (Artifacts Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build signed Release APK
        env:
          AGENT567_ANDROID_KEYSTORE_BASE64: ${{ secrets.AGENT567_ANDROID_KEYSTORE_BASE64 }}
          AGENT567_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AGENT567_ANDROID_KEYSTORE_PASSWORD }}
          AGENT567_ANDROID_KEY_ALIAS: ${{ secrets.AGENT567_ANDROID_KEY_ALIAS }}
          AGENT567_ANDROID_KEY_PASSWORD: ${{ secrets.AGENT567_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -euo pipefail
          : "${AGENT567_ANDROID_KEYSTORE_BASE64:?Missing AGENT567_ANDROID_KEYSTORE_BASE64 secret}"
          : "${AGENT567_ANDROID_KEYSTORE_PASSWORD:?Missing AGENT567_ANDROID_KEYSTORE_PASSWORD secret}"
          : "${AGENT567_ANDROID_KEY_ALIAS:?Missing AGENT567_ANDROID_KEY_ALIAS secret}"
          : "${AGENT567_ANDROID_KEY_PASSWORD:?Missing AGENT567_ANDROID_KEY_PASSWORD secret}"
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/567-agent-release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$AGENT567_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          export AGENT567_ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH"
          ./gradlew --no-daemon :androidApp:assembleRelease
          VERSION="$(sed -n 's/^versionName=//p' version.properties)"
          test -n "$VERSION"
          mkdir -p androidApp/build/outputs/apk/release
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "androidApp/build/outputs/apk/release/567-agent-${VERSION}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-all-android
          path: apps/mobile/androidApp/build/outputs/apk/release/567-agent-*.apk
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            command: package:linux
            artifact_path: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.blockmap
              apps/desktop/release/*.deb
              apps/desktop/release/*.rpm
              apps/desktop/release/latest-linux.yml
          - platform: win
            runner: windows-latest
            command: package:win
            artifact_path: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.blockmap
              apps/desktop/release/*.msi
              apps/desktop/release/*.zip
              apps/desktop/release/latest.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go for IM gateway
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libcap-dev meson ninja-build pkg-config xz-utils rpm

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Install Inno Setup
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          )
          if (-not ($candidates | Where-Object { Test-Path $_ })) {
            throw 'Inno Setup 6 compiler was not found after installation.'
          }

      - name: Build Monorepo Packages
        run: bun run build

      - name: Package Desktop App
        env:
          AGENT567_SPEECH_INPUT_ENABLED: "false"
          AGENT567_BUILD_ENV: "opensource"
          AGENT567_CLOUD_ENABLED: "false"
          AGENT567_UPDATE_PROVIDER: "github"
          AGENT567_UPDATE_GITHUB_OWNER: "Chinachani"
          AGENT567_UPDATE_GITHUB_REPO: "567-agent"
        run: |
          cd apps/desktop
          bun run ${{ matrix.command }}

      - name: Verify Windows installer and portable package
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        run: |
          bun run verify:updates:windows
          bun run verify:packages:windows

      - name: Upload Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-all-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
