name: Build & Release All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: bash ./gradlew --no-daemon :androidApp:assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 567-Agent-Android-debug
          path: apps/mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_pattern: "apps/desktop/dist-pack/*.AppImage"
          - os: windows-latest
            platform: win
            artifact_pattern: "apps/desktop/dist-pack/*.exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Build Monorepo Packages
        run: bun run build

      - name: Build Desktop Preload & Main
        run: |
          cd apps/desktop
          bun run build:preload
          bun run build:main

      - name: Prepare Desktop Package
        run: |
          cd apps/desktop
          bun run prepare:pack

      - name: Package Desktop App
        run: |
          cd apps/desktop
          bun run dist:${{ matrix.platform }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 567-Agent-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}

  create-github-release:
    name: Create GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            567-Agent-Android-debug/*
            567-Agent-linux/*
            567-Agent-win/*
          draft: false
          prerelease: false
