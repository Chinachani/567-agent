name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      cloud_enabled:
        description: "Desktop edition. GitHub and R2 both support commercial builds."
        type: choice
        options: [default, "true", "false"]
        default: default
      api567_base_url:
        description: "API567_BASE_URL override. Required for a commercial build."
        type: string
        required: false
      marketplace_repository:
        description: "Optional GitHub marketplace source for either edition. Empty keeps Environment / repo value."
        type: string
        required: false
      marketplace_ref:
        description: "Optional marketplace Git ref. Empty keeps Environment / repo value, then main."
        type: string
        required: false
      tenant:
        description: "AGENT567_TENANT override (packages/plugins/tenants.json)."
        type: string
        required: false
      speech_input:
        description: "AGENT567_SPEECH_INPUT_ENABLED. default = Environment / repo variable."
        type: choice
        options: [default, "true", "false"]
        default: default
      channel:
        description: "Rewrite update URL / R2 prefix to stable or test when those path segments exist. Dedicated AGENT567_*_TEST / _STABLE vars win."
        type: choice
        options: [default, stable, test]
        default: default
      build_version:
        description: "Test channel only. Semver override for an upgrade candidate, for example 0.5.47."
        type: string
        required: false
      update_url:
        description: "AGENT567_UPDATE_URL override; required for commercial GitHub Releases."
        type: string
        required: false
      r2_prefix:
        description: "AGENT567_R2_PREFIX override (publish job only)."
        type: string
        required: false
      release_target:
        description: "Where a matching tag or stable/test dispatch publishes. default = AGENT567_RELEASE_TARGET or github."
        type: choice
        options: [default, r2, github]
        default: default
      notes:
        description: "Shown on the run summary. Not a secret; do not paste keys."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: resolve desktop release scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'test' && 'desktop-test' || 'desktop-production' }}
    outputs:
      should-build: ${{ steps.scope.outputs.should-build }}
      should-publish: ${{ steps.config.outputs.should_publish }}
      build-version: ${{ steps.config.outputs.build_version }}
      channel: ${{ steps.config.outputs.channel }}
      cloud_enabled: ${{ steps.config.outputs.cloud_enabled }}
      marketplace_repository: ${{ steps.config.outputs.marketplace_repository }}
      marketplace_ref: ${{ steps.config.outputs.marketplace_ref }}
      notes: ${{ steps.config.outputs.notes }}
      r2_bucket: ${{ steps.config.outputs.r2_bucket }}
      r2_prefix: ${{ steps.config.outputs.r2_prefix }}
      release_target: ${{ steps.config.outputs.release_target }}
      api567_base_url: ${{ steps.config.outputs.api567_base_url }}
      speech_input: ${{ steps.config.outputs.speech_input }}
      tenant: ${{ steps.config.outputs.tenant }}
      update_provider: ${{ steps.config.outputs.update_provider }}
      update_url: ${{ steps.config.outputs.update_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Match workflow event to desktop version
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should-build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "${REF_NAME}" == "v${VERSION}" ]]; then
            echo "should-build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Ignoring ${REF_NAME}; desktop package version is ${VERSION}."
            echo "should-build=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve release configuration
        if: steps.scope.outputs.should-build == 'true'
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_BUILD_VERSION: ${{ github.event.inputs.build_version }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_CLOUD_ENABLED: ${{ github.event.inputs.cloud_enabled }}
          INPUT_MARKETPLACE_REPOSITORY: ${{ github.event.inputs.marketplace_repository }}
          INPUT_MARKETPLACE_REF: ${{ github.event.inputs.marketplace_ref }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          INPUT_R2_PREFIX: ${{ github.event.inputs.r2_prefix }}
          INPUT_RELEASE_TARGET: ${{ github.event.inputs.release_target }}
          INPUT_API567_BASE_URL: ${{ github.event.inputs.api567_base_url }}
          INPUT_SPEECH_INPUT: ${{ github.event.inputs.speech_input }}
          INPUT_TENANT: ${{ github.event.inputs.tenant }}
          INPUT_UPDATE_URL: ${{ github.event.inputs.update_url }}
          VAR_CLOUD_ENABLED: ${{ vars.AGENT567_CLOUD_ENABLED }}
          VAR_MARKETPLACE_REPOSITORY: ${{ vars.AGENT567_OPEN_MARKETPLACE_REPOSITORY }}
          VAR_MARKETPLACE_REF: ${{ vars.AGENT567_OPEN_MARKETPLACE_REF }}
          VAR_R2_BUCKET: ${{ vars.AGENT567_R2_BUCKET }}
          VAR_R2_PREFIX: ${{ vars.AGENT567_R2_PREFIX }}
          VAR_R2_PREFIX_STABLE: ${{ vars.AGENT567_R2_PREFIX_STABLE }}
          VAR_R2_PREFIX_TEST: ${{ vars.AGENT567_R2_PREFIX_TEST }}
          VAR_RELEASE_CHANNEL: ${{ vars.AGENT567_RELEASE_CHANNEL }}
          VAR_TEST_BUILD_VERSION: ${{ vars.AGENT567_TEST_BUILD_VERSION }}
          VAR_RELEASE_TARGET: ${{ vars.AGENT567_RELEASE_TARGET }}
          VAR_API567_BASE_URL: ${{ vars.API567_BASE_URL }}
          VAR_SPEECH_INPUT: ${{ vars.AGENT567_SPEECH_INPUT_ENABLED }}
          VAR_TENANT: ${{ vars.AGENT567_TENANT }}
          VAR_UPDATE_URL: ${{ vars.AGENT567_UPDATE_URL }}
          VAR_UPDATE_URL_STABLE: ${{ vars.AGENT567_UPDATE_URL_STABLE }}
          VAR_UPDATE_URL_TEST: ${{ vars.AGENT567_UPDATE_URL_TEST }}
        run: node scripts/release/resolve-desktop-release-config.mjs --github-output >> "${GITHUB_OUTPUT}"

      - name: Write resolved config to the job summary
        if: steps.scope.outputs.should-build == 'true'
        env:
          OUTPUT_BUILD_VERSION: ${{ steps.config.outputs.build_version }}
          OUTPUT_CHANNEL: ${{ steps.config.outputs.channel }}
          OUTPUT_CLOUD_ENABLED: ${{ steps.config.outputs.cloud_enabled }}
          OUTPUT_MARKETPLACE_REPOSITORY: ${{ steps.config.outputs.marketplace_repository }}
          OUTPUT_MARKETPLACE_REF: ${{ steps.config.outputs.marketplace_ref }}
          OUTPUT_NOTES: ${{ steps.config.outputs.notes }}
          OUTPUT_R2_BUCKET: ${{ steps.config.outputs.r2_bucket }}
          OUTPUT_R2_PREFIX: ${{ steps.config.outputs.r2_prefix }}
          OUTPUT_RELEASE_TARGET: ${{ steps.config.outputs.release_target }}
          OUTPUT_SHOULD_PUBLISH: ${{ steps.config.outputs.should_publish }}
          OUTPUT_API567_BASE_URL: ${{ steps.config.outputs.api567_base_url }}
          OUTPUT_SPEECH_INPUT: ${{ steps.config.outputs.speech_input }}
          OUTPUT_TENANT: ${{ steps.config.outputs.tenant }}
          OUTPUT_UPDATE_PROVIDER: ${{ steps.config.outputs.update_provider }}
          OUTPUT_UPDATE_URL: ${{ steps.config.outputs.update_url }}
        run: node scripts/release/resolve-desktop-release-config.mjs --from-outputs --summary >> "${GITHUB_STEP_SUMMARY}"

  quality:
    name: validate and test Desktop release
    needs: prepare
    if: needs.prepare.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      # im-gateway 的 Go 测试不在 `bun run check` 覆盖范围内，而 im-gateway.yml
      # 只在改动命中 apps/im-gateway/** 时触发、且与本流水线没有 needs 依赖。
      # 缺了这一步，一个测试失败的 sidecar 依然会被 prepare-pack.js 交叉编译进
      # 发布包。lint 留在 im-gateway.yml 管：风格问题不该拦发版，行为回归该拦。
      - name: Set up Go for IM gateway
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/im-gateway/go.mod
          cache-dependency-path: apps/im-gateway/go.sum

      - name: Test IM gateway sidecar
        working-directory: apps/im-gateway
        run: go test ./...

      # 发布说明就是 GitHub Release 的正文。放在这里失败，而不是等四个平台
      # 签名公证跑完两小时后才发现没有正文可发。
      - name: Verify release notes exist
        run: node scripts/release/release-notes.mjs --check

      - name: Run repository checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run check

      - name: Test Desktop unit suite
        working-directory: apps/desktop
        run: bun run test

      - name: Test quality and release configuration
        run: bun run test:quality

      - name: Verify Desktop packaging contract
        run: bun run verify:desktop:contracts

      - name: Test Desktop packaging helpers
        run: bun run test:desktop:packaging

  android:
    name: build Android APK
    needs: prepare
    if: needs.prepare.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build signed Release APK
        env:
          AGENT567_ANDROID_KEYSTORE_BASE64: ${{ secrets.AGENT567_ANDROID_KEYSTORE_BASE64 }}
          AGENT567_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AGENT567_ANDROID_KEYSTORE_PASSWORD }}
          AGENT567_ANDROID_KEY_ALIAS: ${{ secrets.AGENT567_ANDROID_KEY_ALIAS }}
          AGENT567_ANDROID_KEY_PASSWORD: ${{ secrets.AGENT567_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -euo pipefail
          : "${AGENT567_ANDROID_KEYSTORE_BASE64:?Missing AGENT567_ANDROID_KEYSTORE_BASE64 secret}"
          : "${AGENT567_ANDROID_KEYSTORE_PASSWORD:?Missing AGENT567_ANDROID_KEYSTORE_PASSWORD secret}"
          : "${AGENT567_ANDROID_KEY_ALIAS:?Missing AGENT567_ANDROID_KEY_ALIAS secret}"
          : "${AGENT567_ANDROID_KEY_PASSWORD:?Missing AGENT567_ANDROID_KEY_PASSWORD secret}"
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/567-agent-release.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$AGENT567_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          export AGENT567_ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH"
          ./gradlew --no-daemon :androidApp:assembleRelease
          VERSION="$(sed -n 's/^versionName=//p' version.properties)"
          test -n "$VERSION"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "androidApp/build/outputs/apk/release/567-agent-${VERSION}.apk"

      - name: Upload Android APK for the single Release publisher
        uses: actions/upload-artifact@v4
        with:
          name: desktop-android
          path: apps/mobile/androidApp/build/outputs/apk/release/567-agent-*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: build ${{ matrix.platform }}
    needs: [prepare, quality]
    if: needs.prepare.outputs.should-build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: ${{ needs.prepare.outputs.channel == 'test' && 'desktop-test' || 'desktop-production' }}
    strategy:
      fail-fast: false
      matrix: &release-platforms
        include:
          - platform: windows
            runner: windows-latest
            command: dist:win
            verify: verify:updates:windows
          - platform: linux
            runner: ubuntu-latest
            command: dist:linux
            verify: verify:updates:linux:release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Go for IM gateway
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/im-gateway/go.mod
          cache-dependency-path: apps/im-gateway/go.sum

      - name: Restore packaging tool downloads
        id: download-cache
        uses: ./.github/actions/desktop-download-cache

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libcap-dev meson ninja-build pkg-config xz-utils rpm

      # release/ 不在版本控制里，actions/checkout 清不掉。复用工作目录的 runner 上
      # 残留的旧版本 latest*.yml 会让合并与发布脚本读到多个版本直接失败。
      - name: Clean previous release artifacts
        shell: bash
        run: rm -rf apps/desktop/release

      - name: Apply resolved release configuration
        shell: bash
        env:
          OUTPUT_BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
          OUTPUT_CHANNEL: ${{ needs.prepare.outputs.channel }}
          OUTPUT_CLOUD_ENABLED: ${{ needs.prepare.outputs.cloud_enabled }}
          OUTPUT_MARKETPLACE_REPOSITORY: ${{ needs.prepare.outputs.marketplace_repository }}
          OUTPUT_MARKETPLACE_REF: ${{ needs.prepare.outputs.marketplace_ref }}
          OUTPUT_NOTES: ${{ needs.prepare.outputs.notes }}
          OUTPUT_R2_BUCKET: ${{ needs.prepare.outputs.r2_bucket }}
          OUTPUT_R2_PREFIX: ${{ needs.prepare.outputs.r2_prefix }}
          OUTPUT_RELEASE_TARGET: ${{ needs.prepare.outputs.release_target }}
          OUTPUT_SHOULD_PUBLISH: ${{ needs.prepare.outputs.should-publish }}
          OUTPUT_API567_BASE_URL: ${{ needs.prepare.outputs.api567_base_url }}
          OUTPUT_SPEECH_INPUT: ${{ needs.prepare.outputs.speech_input }}
          OUTPUT_TENANT: ${{ needs.prepare.outputs.tenant }}
          OUTPUT_UPDATE_PROVIDER: ${{ needs.prepare.outputs.update_provider }}
          OUTPUT_UPDATE_URL: ${{ needs.prepare.outputs.update_url }}
        run: node scripts/release/resolve-desktop-release-config.mjs --from-outputs --export-env >> "${GITHUB_ENV}"

      - name: Prepare cached release resources
        uses: ./.github/actions/prepare-desktop-resources

      - name: Build updater artifacts
        working-directory: apps/desktop
        env:
          # 由 prepare 解析：dispatch 表单 > desktop-production Environment/仓库 Variables。
          # fork 不配任何值就得到开源版。空 optional 键不会写入 GITHUB_ENV。
          AGENT567_UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          AGENT567_UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}
        run: bun run ${{ matrix.command }}

      # Archive before verification so an E2E/install failure never discards a build.
      - name: Archive build checkpoint
        shell: bash
        run: |
          (cd "${RUNNER_TEMP}" && tar --exclude=builder-debug.yml --exclude=builder-effective-config.yaml -cf release-build.tar -C "${GITHUB_WORKSPACE}/apps/desktop" release)

      - name: Upload build checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-build.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Save packaging tool downloads
        if: ${{ !cancelled() && steps.download-cache.outputs.tools-key != '' && steps.download-cache.outputs.tools-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.download-cache.outputs.tools-path }}
          key: ${{ steps.download-cache.outputs.tools-key }}

  verify:
    name: verify ${{ matrix.platform }}
    needs: [prepare, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: *release-platforms

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Install Linux Electron runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libasound2t64

      - name: Download build checkpoint
        uses: actions/download-artifact@v4
        with:
          name: release-build-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-checkpoint

      - name: Restore build checkpoint
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
        run: |
          rm -rf apps/desktop/release
          ARCHIVE_PATH="${RUNNER_TEMP}/release-checkpoint/release-build.tar"
          TARGET_PATH="${GITHUB_WORKSPACE}/apps/desktop"
          # GNU tar on Windows parses a drive-letter path as a remote host. Convert
          # both paths to Git Bash POSIX paths there; Linux already uses POSIX paths.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ARCHIVE_PATH="$(cygpath -u "${ARCHIVE_PATH}")"
            TARGET_PATH="$(cygpath -u "${TARGET_PATH}")"
          fi
          tar -xf "${ARCHIVE_PATH}" -C "${TARGET_PATH}"
          # WDIO's update fixture and Linux AppImage path must use the dispatched candidate version.
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            if (process.env.BUILD_VERSION) {
              if (!/^\d+\.\d+\.\d+$/.test(process.env.BUILD_VERSION)) throw new Error("Invalid build version");
              const file = "apps/desktop/package.json";
              const pkg = JSON.parse(readFileSync(file, "utf8"));
              pkg.version = process.env.BUILD_VERSION;
              writeFileSync(file, JSON.stringify(pkg));
            }
          '

      - name: Verify platform updater artifacts
        if: matrix.verify != ''
        working-directory: apps/desktop
        run: bun run ${{ matrix.verify }}

      # Inno 负责自动更新；MSI 做独立安装验证，ZIP 检查便携启动器布局。
      - name: Verify Windows installer and packages
        if: matrix.platform == 'windows'
        working-directory: apps/desktop
        run: bun run verify:packages:windows

      # 包内清单校验能捕获元数据和路径错误；容器安装再覆盖 dpkg/dnf 的真实事务、
      # desktop entry 与 electron-updater 用于选择 deb/rpm 的 package-type 标记。
      - name: Verify native Linux package installation
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          docker run --rm --volume "${PWD}/release:/release:ro" ubuntu:24.04 bash -euo pipefail -c '
            apt-get update
            apt-get install --yes /release/*.deb
            test -x /opt/567-agent/567-agent
            test "$(cat /opt/567-agent/resources/package-type)" = "deb"
            test -f /usr/share/applications/567-agent.desktop
          '
          docker run --rm --volume "${PWD}/release:/release:ro" fedora:latest bash -euo pipefail -c '
            dnf install --assumeyes --nogpgcheck /release/*.rpm
            test -x /opt/567-agent/567-agent
            test "$(cat /opt/567-agent/resources/package-type)" = "rpm"
            test -f /usr/share/applications/567-agent.desktop
          '

      - name: Run packaged app and updater E2E
        working-directory: apps/desktop
        env:
          AGENT567_E2E_PACKAGED: "1"
          AGENT567_E2E_UPDATE_FEED: "1"
          AGENT567_SPEECH_INPUT_ENABLED: "false"
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run --auto-servernum bun run test:e2e:packaged
          else
            bun run test:e2e:packaged
          fi

      - name: Re-verify platform updater artifacts after packaged E2E
        if: matrix.verify != ''
        working-directory: apps/desktop
        run: bun run ${{ matrix.verify }}

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.rpm
            apps/desktop/release/*.zip
            apps/desktop/release/latest*.yml

  publish-r2:
    name: publish R2
    if: needs.prepare.outputs.should-build == 'true' && needs.prepare.outputs.should-publish == 'true' && needs.prepare.outputs.release_target == 'r2'
    needs: [prepare, quality, build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.prepare.outputs.channel == 'test' && 'desktop-test' || 'desktop-production' }}
    concurrency:
      group: desktop-${{ needs.prepare.outputs.channel }}-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: apps/desktop/release

      - name: Apply resolved release configuration
        shell: bash
        env:
          OUTPUT_BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
          OUTPUT_CHANNEL: ${{ needs.prepare.outputs.channel }}
          OUTPUT_CLOUD_ENABLED: ${{ needs.prepare.outputs.cloud_enabled }}
          OUTPUT_MARKETPLACE_REPOSITORY: ${{ needs.prepare.outputs.marketplace_repository }}
          OUTPUT_MARKETPLACE_REF: ${{ needs.prepare.outputs.marketplace_ref }}
          OUTPUT_NOTES: ${{ needs.prepare.outputs.notes }}
          OUTPUT_R2_BUCKET: ${{ needs.prepare.outputs.r2_bucket }}
          OUTPUT_R2_PREFIX: ${{ needs.prepare.outputs.r2_prefix }}
          OUTPUT_RELEASE_TARGET: ${{ needs.prepare.outputs.release_target }}
          OUTPUT_SHOULD_PUBLISH: ${{ needs.prepare.outputs.should-publish }}
          OUTPUT_API567_BASE_URL: ${{ needs.prepare.outputs.api567_base_url }}
          OUTPUT_SPEECH_INPUT: ${{ needs.prepare.outputs.speech_input }}
          OUTPUT_TENANT: ${{ needs.prepare.outputs.tenant }}
          OUTPUT_UPDATE_PROVIDER: ${{ needs.prepare.outputs.update_provider }}
          OUTPUT_UPDATE_URL: ${{ needs.prepare.outputs.update_url }}
        run: node scripts/release/resolve-desktop-release-config.mjs --from-outputs --export-env >> "${GITHUB_ENV}"

      - name: Publish artifacts before metadata
        working-directory: apps/desktop
        env:
          AGENT567_R2_ACCOUNT_ID: ${{ secrets.AGENT567_R2_ACCOUNT_ID }}
          AGENT567_R2_ACCESS_KEY_ID: ${{ secrets.AGENT567_R2_ACCESS_KEY_ID }}
          AGENT567_R2_SECRET_ACCESS_KEY: ${{ secrets.AGENT567_R2_SECRET_ACCESS_KEY }}
        run: bun run publish:updates:r2

  # Every non-test release has one GitHub Release as its download entry point.
  # R2 commercial builds additionally publish the updater feed to R2.
  publish-github:
    name: publish GitHub Release
    if: needs.prepare.outputs.should-build == 'true' && needs.prepare.outputs.should-publish == 'true' && needs.prepare.outputs.channel != 'test'
    needs: [prepare, quality, build, verify, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-production
    concurrency:
      group: desktop-production-publish
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: apps/desktop/release

      - name: Publish release after all assets are ready
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
        shell: bash
        run: |
          VERSION="${BUILD_VERSION:-$(node -p "require('./apps/desktop/package.json').version")}"
          TAG="v${VERSION}"
          NOTES_FILE="$(node scripts/release/release-notes.mjs --version "${VERSION}")"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "Refusing to modify published release ${TAG}." >&2
              exit 1
            fi
            echo "Resuming draft release ${TAG}"
            gh release edit "${TAG}" --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" --draft --notes-file "${NOTES_FILE}" --title "567 Agent ${VERSION}" --target "${GITHUB_SHA}"
          fi
          find apps/desktop/release -maxdepth 1 -type f -print0 \
            | xargs -0 gh release upload "${TAG}" --clobber
          gh release edit "${TAG}" --draft=false

  verify-feed-r2:
    name: verify published r2 feed
    needs: [prepare, publish-r2]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies
      - name: Verify published update feed
        working-directory: apps/desktop
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
          AGENT567_UPDATE_PROVIDER: generic
          AGENT567_UPDATE_URL: ${{ needs.prepare.outputs.update_url }}
        run: |
          export AGENT567_DESKTOP_RELEASE_VERSION="${BUILD_VERSION:-$(node -p "require('./package.json').version")}"
          node scripts/verify-update-feed.mjs

  verify-feed-github:
    name: verify published github feed
    needs: [prepare, publish-github]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies
      - name: Verify published update feed
        working-directory: apps/desktop
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
          AGENT567_UPDATE_PROVIDER: ${{ needs.prepare.outputs.update_provider }}
          AGENT567_UPDATE_URL: ${{ needs.prepare.outputs.update_url }}
          AGENT567_UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          AGENT567_UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          export AGENT567_DESKTOP_RELEASE_VERSION="${BUILD_VERSION:-$(node -p "require('./package.json').version")}"
          node scripts/verify-update-feed.mjs
